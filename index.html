<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Examen</title>
    <style>
        :root {
            --primary-color: #007aff;
            --annul-color: #ff3b30;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --border-color: #d2d2d7;
            --disabled-color: #e5e5ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header input[type="text"] {
            width: 100%;
            max-width: 400px;
            font-size: 1.2rem;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            margin-top: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        .header input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .q-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .question-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .q-number {
            font-weight: 700;
            font-size: 1.1rem;
            width: 50px;
        }

        .annul-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--annul-color);
            width: 50px;
            letter-spacing: -0.5px;
        }

        .options {
            display: flex;
            gap: 8px;
        }

        .circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            background-color: white;
        }

        .circle:hover:not(.disabled) {
            border-color: #999;
            color: #999;
        }

        /* Estados de la hilera principal */
        .main-row .circle.selected {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .main-row .circle.disabled {
            background-color: var(--disabled-color);
            border-color: var(--disabled-color);
            color: white;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Estados de la hilera de anulación */
        .annul-row .circle {
            width: 24px;
            height: 24px;
            font-size: 0.75rem;
            border-width: 1px;
        }

        .annul-row .circle.annulled {
            background-color: var(--annul-color);
            border-color: var(--annul-color);
            color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-clear {
            background-color: #ff3b30;
            color: white;
        }

        .btn-clear:hover { background-color: #d70015; }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-save:hover { background-color: #0056b3; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Plantilla de Respuestas</h2>
            <input type="text" id="examTitle" placeholder="Título de la plantilla...">
        </div>

        <div class="grid" id="examGrid">
            <!-- Las preguntas se inyectan mediante JS -->
        </div>

        <div class="controls">
            <button class="btn-clear" id="clearBtn">Limpiar Plantilla</button>
            <button class="btn-save" id="saveBtn">Descargar Archivo</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const totalQuestions = 100;
            const grid = document.getElementById('examGrid');
            const titleInput = document.getElementById('examTitle');
            
            let savedState = JSON.parse(localStorage.getItem('plantillaOposicion')) || { 
                title: '', 
                answers: {}, 
                annulled: {} 
            };
            
            if (savedState.title) titleInput.value = savedState.title;

            for (let i = 1; i <= totalQuestions; i++) {
                const qBlock = document.createElement('div');
                qBlock.className = 'q-block';

                // HILERA PRINCIPAL
                const mainRow = document.createElement('div');
                mainRow.className = 'question-row main-row';
                
                const number = document.createElement('div');
                number.className = 'q-number';
                number.textContent = i;
                
                const mainOptions = document.createElement('div');
                mainOptions.className = 'options';

                // HILERA DE ANULACIÓN
                const annulRow = document.createElement('div');
                annulRow.className = 'question-row annul-row';
                
                const annulLabel = document.createElement('div');
                annulLabel.className = 'annul-label';
                annulLabel.textContent = 'ANULAR';
                
                const annulOptions = document.createElement('div');
                annulOptions.className = 'options';

                if (!savedState.annulled[i]) savedState.annulled[i] = [];

                ['A', 'B', 'C'].forEach(letter => {
                    // Círculos principales
                    const mainCircle = document.createElement('div');
                    mainCircle.className = 'circle main-circle';
                    mainCircle.textContent = letter;
                    mainCircle.dataset.letter = letter;
                    
                    // Círculos de anulación
                    const annulCircle = document.createElement('div');
                    annulCircle.className = 'circle annul-circle';
                    annulCircle.textContent = letter;
                    annulCircle.dataset.letter = letter;

                    // Restaurar estado guardado
                    const isAnnulled = savedState.annulled[i].includes(letter);
                    if (isAnnulled) {
                        mainCircle.classList.add('disabled');
                        annulCircle.classList.add('annulled');
                    }
                    
                    if (savedState.answers[i] === letter && !isAnnulled) {
                        mainCircle.classList.add('selected');
                    }

                    // Evento: Marcar respuesta principal
                    mainCircle.addEventListener('click', () => {
                        if (savedState.annulled[i].includes(letter)) return; // Bloqueado si está anulada
                        
                        // Quitar selección previa en esta pregunta
                        Array.from(mainOptions.children).forEach(c => c.classList.remove('selected'));
                        
                        mainCircle.classList.add('selected');
                        savedState.answers[i] = letter;
                        saveToLocal();
                    });

                    // Evento: Anular respuesta
                    annulCircle.addEventListener('click', () => {
                        if (!savedState.annulled[i].includes(letter)) {
                            savedState.annulled[i].push(letter);
                            annulCircle.classList.add('annulled');
                            mainCircle.classList.add('disabled');
                            mainCircle.classList.remove('selected');
                            
                            // Si la anulada era la que estaba marcada como respuesta, la borramos
                            if (savedState.answers[i] === letter) {
                                delete savedState.answers[i];
                            }
                            saveToLocal();
                        }
                    });

                    mainOptions.appendChild(mainCircle);
                    annulOptions.appendChild(annulCircle);
                });

                mainRow.appendChild(number);
                mainRow.appendChild(mainOptions);
                
                annulRow.appendChild(annulLabel);
                annulRow.appendChild(annulOptions);

                qBlock.appendChild(mainRow);
                qBlock.appendChild(annulRow);
                grid.appendChild(qBlock);
            }

            titleInput.addEventListener('input', () => {
                savedState.title = titleInput.value;
                saveToLocal();
            });

            function saveToLocal() {
                localStorage.setItem('plantillaOposicion', JSON.stringify(savedState));
            }

            document.getElementById('clearBtn').addEventListener('click', () => {
                if(confirm('¿Limpiar toda la plantilla? Se perderán las respuestas y anulaciones actuales.')) {
                    savedState = { title: titleInput.value, answers: {}, annulled: {} };
                    saveToLocal();
                    location.reload(); // Recarga limpia de la UI
                }
            });

            document.getElementById('saveBtn').addEventListener('click', () => {
                const title = titleInput.value || 'Plantilla_Examen';
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedState, null, 2));
                const downloadNode = document.createElement('a');
                downloadNode.setAttribute("href", dataStr);
                downloadNode.setAttribute("download", title.replace(/\s+/g, '_') + ".json");
                document.body.appendChild(downloadNode);
                downloadNode.click();
                downloadNode.remove();
            });
        });
    </script>
</body>
</html>
